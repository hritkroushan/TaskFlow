<!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>TaskFlow - Team Task Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19; --surface: #131825; --surface2: #1a2235;
            --border: #2a3550; --text: #e8eaf0; --text2: #8892a8;
                          --accent: #4f7ef8; --green: #22c55e; --amber: #f59e0b; --red: #ef4444;
              }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; height: 100vh; display: flex; overflow: hidden; }
        #sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #topbar { height: 60px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; justify-content: space-between; }
        #content { flex: 1; overflow-y: auto; padding: 24px; }
        .logo { padding: 20px; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; border-bottom: 1px solid var(--border); }
        .logo span { color: var(--accent); }
        .nav-item { padding: 12px 20px; color: var(--text2); cursor: pointer; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: var(--surface2); color: var(--text); }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 12px; }
        .stat-val { font-size: 32px; font-weight: 700; font-family: 'Syne', sans-serif; margin-top: 8px; }
        .btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    </style>
      </head>
      <body>
          <div id="sidebar">
              <div class="logo">Task<span>Flow</span></div>
              <div class="nav-item active">Dashboard</div>
              <div class="nav-item">Projects</div>
              <div class="nav-item">Tasks</div>
              <div class="nav-item">Team</div>
          </div>
          <div id="main">
              <div id="topbar">
                  <h2 style="font-family: 'Syne'">Dashboard</h2>
                  <button class="btn">+ New Task</button>
              </div>
        <div id="content">
                  <div class="stat-grid">
                      <div class="card"><div>Total Tasks</div><div class="stat-val">8</div></div>
                      <div class="card"><div>Completed</div><div class="stat-val" style="color:var(--green)">5</div></div>
                      <div class="card"><div>In Progress</div><div class="stat-val" style="color:var(--amber)">2</div></div>
                      <div class="card"><div>Overdue</div><div class="stat-val" style="color:var(--red)">1</div></div>
                  </div>
                  <div class="card">
                      <h3 style="margin-bottom:16px">Recent Projects</h3>
                      <div style="display:flex; flex-direction:column; gap:12px">
                          <div style="background:var(--surface2); padding:12px; border-radius:8px">Website Redesign - 80% complete</div>
                          <div style="background:var(--surface2); padding:12px; border-radius:8px">Mobile App Dev - 45% complete</div>
                      </div>
                  </div>
            </div>
          </div>
          <script>
              console.log('TaskFlow initialized');
          </script>
      </body>
      </html>
